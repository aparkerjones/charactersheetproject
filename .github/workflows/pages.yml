name: Deploy GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run engine tests
        run: npm test
      - name: Run lint
        run: npm run lint
      - name: Build static site
        run: npm run build
        env:
          GITHUB_PAGES: "true"
      - name: Prepare static files for GitHub Pages
        run: |
          touch out/.nojekyll
          find out -type f -path '*/__next.*/*.txt' -print0 | while IFS= read -r -d '' payload; do
            payload_dir="${payload%/*}"
            route_dir="${payload_dir%/*}"
            route_segment="${payload_dir##*/}"
            payload_name="${payload##*/}"
            cp "$payload" "$route_dir/$route_segment.$payload_name"
          done
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
